version: '3.8'

# Auto-merged by Docker Compose on `docker compose up`.
# Contains all local dev overrides — ports, code mounts, env files, credentials.

services:
  db:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6379:6379"

  redis-exporter:
    ports:
      - "9121:9121"

  livekit:
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50200-50300:50200-50300/udp"
    env_file:
      - ./backend/.env.local

  backend:
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    env_file:
      - ./backend/.env.local

  frontend:
    build:
      target: development
      args:
        - VITE_API_URL=http://localhost:8001/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
