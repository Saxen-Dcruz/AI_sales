# Auto-merged by Docker Compose on `docker compose up`.
# Contains all local dev overrides — ports, code mounts, env files, credentials.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rdl_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=rdl_sales
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rdl_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d rdl_sales" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    ports:
      - "6379:6379"

  redis-exporter:
    ports:
      - "9121:9121"

  livekit:
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50200-50300:50200-50300/udp"
    env_file:
      - ./backend/.env.local

  backend:
    # Dev-only container name — avoids a stale 'rdl_backend' name registered in the
    # local Docker daemon. Inter-service DNS uses the 'backend' service name, and the
    # dev frontend reaches it via localhost:8001, so this rename is safe for local dev.
    container_name: rdl_backend_dev
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Local dev talks to the standalone rdl_db container directly over the
      # compose network (rdl_db is attached to ai_sales_rdl_network at startup).
      # Container-to-container avoids host.docker.internal resolving to an
      # unreachable IPv6 address. Prod keeps the base compose's 6432 (pgbouncer).
      - POSTGRES_SERVER=rdl_db
      - POSTGRES_PORT=5432
    volumes:
      - ./backend:/app
      - ./data:/data
    env_file:
      - ./backend/.env.local

  frontend:
    build:
      target: development
      args:
        - VITE_API_URL=http://localhost:8001/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  postgres_data:
