# livekit.yaml
port: 7880
logging:
  level: info

rtc:
  tcp_port: 7881
  # LiveKit needs a range of UDP ports for audio/video transport
  port_range_start: 50000
  port_range_end: 50100
  
  # This helps LiveKit auto-discover the correct IP (localhost or VPS IP)
  use_external_ip: true
  node_ip: 192.168.1.15


# We do NOT put keys here anymore. 
# We will inject them via Docker environment variables for security.
keys: {}
