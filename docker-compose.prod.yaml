version: '3.8'

# Production overlay — use with:
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --build

services:
  backend:
    env_file:
      - ./backend/.env.local
    environment:
      - LIVEKIT_WS_URL=wss://118-139-165-99.nip.io:8443/livekit
      - LANGCHAIN_TRACING_V2=true
    restart: unless-stopped

  livekit:
    restart: unless-stopped
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml
    env_file:
      - ./backend/.env.local
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50200-50300:50200-50300/udp"

  frontend:
    build:
      target: production
      args:
        - VITE_API_URL=https://118-139-165-99.nip.io:8443/api/v1/
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
