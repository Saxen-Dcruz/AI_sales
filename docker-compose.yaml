version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rdl_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=rdl_sales
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rdl_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d rdl_sales" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: rdl_redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - rdl_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: rdl_redis_exporter
    environment:
      - REDIS_ADDR=redis:6379
    networks:
      - rdl_network
    depends_on:
      - redis

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.local.yaml:/etc/livekit.yaml
    networks:
      - rdl_network
    environment:
      - LIVEKIT_REDIS_ADDRESS=redis:6379
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--spider", "http://localhost:7880/" ]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rdl_backend
    ports:
      - "8003:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
      - LIVEKIT_API_URL=http://livekit:7880
      - LIVEKIT_WS_URL=ws://livekit:7880
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rdl_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    container_name: rdl_frontend
    networks:
      - rdl_network
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: rdl_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      - backend
    networks:
      - rdl_network

  grafana:
    image: grafana/grafana:latest
    container_name: rdl_grafana
    depends_on:
      - prometheus
    networks:
      - rdl_network

volumes:
  redis_data:
  postgres_data:


networks:
  rdl_network:
    driver: bridge
