# Only set "Connection: upgrade" for actual WebSocket upgrade requests — the
# /api/ location handles both plain REST calls and the Gmail live-updates socket,
# and forcing "upgrade" unconditionally hangs every regular HTTP request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect plain HTTP to HTTPS
server {
    listen 8080;
    server_name 118-139-165-99.nip.io;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    server_name 118-139-165-99.nip.io;

    ssl_certificate     /etc/letsencrypt/live/118-139-165-99.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/118-139-165-99.nip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 1. Serve the React UI
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # This try_files line is CRITICAL for React Router to work
        try_files $uri $uri/ /index.html;
        # Never cache index.html so browsers always get the latest JS bundle reference
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache hashed static assets aggressively
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. Route API calls to the Python Backend
    location /api/ {
        proxy_pass http://rdl_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Route LiveKit signaling (WebSocket) through the same cert/port
    location /livekit {
        proxy_pass http://livekit:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
