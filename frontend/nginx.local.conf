# Only set "Connection: upgrade" for actual WebSocket upgrade requests — the
# /api/ location handles both plain REST calls and the Gmail live-updates socket,
# and forcing "upgrade" unconditionally hangs every regular HTTP request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # 1. Serve the React UI
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # This try_files line is CRITICAL for React Router to work
        try_files $uri $uri/ /index.html;
    }

    # 2. Route API calls to the Python Backend
    location /api/ {
        # REMOVED the trailing slash here!
        proxy_pass http://rdl_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}