# livekit.yaml
port: 7880
logging:
  level: info

rtc:
  tcp_port: 7881
  # LiveKit needs a range of UDP ports for audio/video transport
  port_range_start: 50200
  port_range_end: 50300

  # node_ip is set explicitly so STUN lookup is not needed
  use_external_ip: false
  node_ip: 118.139.165.99


# We do NOT put keys here anymore. 
# We will inject them via Docker environment variables for security.
keys: {}
