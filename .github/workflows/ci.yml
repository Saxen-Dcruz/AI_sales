name: CI

# Validation only — runs on PRs into dev and on feature/hotfix branch pushes.
# Nothing is published here; image publishing + deploy lives in deploy.yml.
on:
  pull_request:
    branches: [dev]
  push:
    branches:
      - 'feature/**'
      - 'hotfix/**'
      - backend-dev
      - frontend-dev

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-lint-build:
    name: Frontend · lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build (placeholder API URL — real URL is baked at deploy time)
        run: npm run build
        env:
          VITE_API_URL: https://example.invalid/api/v1/

  backend-tests:
    name: Backend · tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rdl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rdl_test
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      LIVEKIT_API_URL: http://localhost:7880
      LIVEKIT_API_KEY: ci-dummy-key
      LIVEKIT_API_SECRET: ci-dummy-secret
      LIVEKIT_WS_URL: ws://localhost:7880
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --default-timeout=1000 -r requirements.txt

      # test_rag_eval.py and tests/load/ are standalone scripts meant to be run
      # manually against real Gemini/LiveKit credentials (see their own docstrings)
      # — they're not part of the regression gate and would just fail on missing keys.
      - name: Run backend test suite
        run: pytest tests/ --ignore=tests/test_rag_eval.py --ignore=tests/load -v

  build-images:
    name: Build image · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Validate the Dockerfile + dependency install without publishing anything.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: production
          push: false
          load: false
          build-args: |
            VITE_API_URL=https://example.invalid/api/v1/
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
